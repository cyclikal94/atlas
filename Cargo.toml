[workspace]
members = ["crates/core", "crates/server"]
resolver = "3"

[workspace.dependencies]
anyhow = { version = "1" }
argon2 = { version = "0.6" }
atlas-core = { version = "0.1.0", path = "crates/core" }
axum = { version = "=0.8.9" }
axum-extra = { version = "=0.12.6", default-features = false }
base64 = { version = "0.23" }
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10.4" }
ece = { version = "2.3" }
hmac = { version = "0.13" }
ical = { version = "0.11" }
openidconnect = { version = "=4.0.1", default-features = false }
reqwest = { version = "0.12", default-features = false }
ring = { version = "0.17" }
serde = { version = "1" }
serde_json = { version = "1" }
sha2 = { version = "0.11" }
sqlx = { version = "=0.9.0", default-features = false }
tempfile = { version = "3" }
time = { version = "0.3" }
tokio = { version = "1" }
tower = { version = "0.5" }
url = { version = "2" }
uuid = { version = "1" }
web-push = { version = "=0.11.0", default-features = false }
