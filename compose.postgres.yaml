services:
  atlas:
    environment:
      ATLAS_DATABASE_URL: postgres://atlas:${ATLAS_POSTGRES_PASSWORD:?Set ATLAS_POSTGRES_PASSWORD in .env}@postgres:5432/atlas
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_DB: atlas
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:?Set ATLAS_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U atlas -d atlas]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
volumes:
  postgres-data:
