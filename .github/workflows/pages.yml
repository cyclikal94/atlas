name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - api/openapi.json
      - docs/**
      - scripts/build_site.py
      - scripts/requirements-site.txt
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - api/openapi.json
      - docs/**
      - scripts/build_site.py
      - scripts/requirements-site.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: scripts/requirements-site.txt
      - run: python -m pip install -r scripts/requirements-site.txt
      - name: Render documentation
        run: python scripts/build_site.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
