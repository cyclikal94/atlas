version: 2
updates:
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    groups:
      api-contract-tooling:
        patterns:
          - openapi-spec-validator
          - jsonschema
  # The generator's output is every consumer's view of the API, so a bump is reviewed by
  # regenerating and diffing the declarations against the previous release.
  - package-ecosystem: npm
    directory: /scripts/api-types
    schedule:
      interval: weekly
    groups:
      api-types-tooling:
        patterns:
          - openapi-typescript
          - typescript
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
