name: atlas
services:
  atlas:
    image: ${ATLAS_IMAGE:-atlas-api:local}
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ATLAS_BIND: 0.0.0.0:3000
      ATLAS_PUBLIC_ORIGIN: ${ATLAS_PUBLIC_ORIGIN:-http://localhost:3000}
      ATLAS_SYNC_RETENTION_DAYS: ${ATLAS_SYNC_RETENTION_DAYS:-90}
    env_file:
      - path: ./atlas.env
        required: false
    ports:
      - '${ATLAS_LISTEN_ADDRESS:-127.0.0.1}:3000:3000'
    healthcheck:
      test: [CMD, atlas-server, probe]
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
